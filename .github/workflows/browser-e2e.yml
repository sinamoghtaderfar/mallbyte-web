name: Browser E2E smoke checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm 10 can fail to add an ephemeral dependency into an existing
      # Next.js dependency tree. Install the browser runner separately.
      - name: Install isolated Playwright test runner
        run: |
          mkdir -p .playwright-runner
          npm install --prefix .playwright-runner --no-save @playwright/test@1.58.2
          ln -s ../.playwright-runner/node_modules/@playwright node_modules/@playwright
      - name: Install Chromium and browser libraries
        run: .playwright-runner/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser tests with mocked APIs
        run: .playwright-runner/node_modules/.bin/playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
